<script>
// グローバルショートカット: 「:」キー（Morse Boardで「:」を打鍵した場合も同じキー入力として届く）でトップ画面へ戻る
document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.key !== ':') return;
    const target = e.target;
    const isTyping = target instanceof Element && (target.matches('input, select, textarea') || target.isContentEditable);
    if (isTyping) return;
    e.preventDefault();
    location.href = 'https://jl1gix.com';
});

// グローバルショートカット: 「M」キー（Morse Boardで「M」＝「－－」を打鍵した場合も同じキー入力として届く）で
// ハンバーガーメニューの開閉をトグルする。状態の保存は行わない。
document.addEventListener('keydown', function (e) {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.toUpperCase() !== 'M') return;
    const target = e.target;
    const isTyping = target instanceof Element && (target.matches('input, select, textarea') || target.isContentEditable);
    if (isTyping) return;
    const panel = document.getElementById('menu-panel');
    const overlay = document.getElementById('menu-overlay');
    if (!panel || !overlay) return;
    e.preventDefault();
    panel.classList.toggle('open');
    overlay.classList.toggle('open');
});
</script>

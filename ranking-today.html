<script>
const API = 'https://api.jl1gix.com';

// サーバーから返る created_at が "YYYY-MM-DD HH:MM:SS" のようにタイムゾーン
// 記号（Z や +09:00 など）を含まない場合、素の new Date(str) はブラウザに
// よって「ローカル時刻」として解釈されてしまい、下の JST 変換(+9h)と二重に
// ズレて日付がずれる可能性がある。常に UTC として安全に解釈する。
function parseServerTime(s) {
    if (typeof s !== 'string') return new Date(s);
    const t = s.trim();
    if (/[Zz]|[+-]\d{2}:?\d{2}$/.test(t)) return new Date(t);
    return new Date(t.replace(' ', 'T') + 'Z');
}
const DAY_OFFSET = 0; // 0 = 今日
const PAGE_SIZE = 100;
let currentMode = 'RX';
let currentMinutes = 1;
let currentPage = 1;
let totalPages = 1;
let filteredRows = [];
// 今プレイして登録した自分のスコアを光らせるためのID(結果画面からの"hl="パラメータ)
let highlightId = null;

function jstDateStr(d) {
    const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
    return `${jst.getUTCFullYear()}/${String(jst.getUTCMonth()+1).padStart(2,'0')}/${String(jst.getUTCDate()).padStart(2,'0')}`;
}

function targetDateStr() {
    const now = new Date();
    const target = new Date(now.getTime() + DAY_OFFSET * 24 * 60 * 60 * 1000);
    return jstDateStr(target);
}

async function fetchAllRows(mode, minutes) {
    const firstRes = await fetch(`${API}/api/scores?mode=${mode}&minutes=${minutes}&page=1`);
    if (!firstRes.ok) throw new Error('server error');
    const firstData = await firstRes.json();
    const total = firstData.total || 0;
    const pages = Math.max(1, Math.ceil(total / 100));
    let rows = firstData.rows || [];
    if (pages > 1) {
        const promises = [];
        for (let p = 2; p <= pages; p++) {
            promises.push(
                fetch(`${API}/api/scores?mode=${mode}&minutes=${minutes}&page=${p}`)
                    .then(r => (r.ok ? r.json() : { rows: [] }))
            );
        }
        const results = await Promise.all(promises);
        results.forEach(d => { rows = rows.concat(d.rows || []); });
    }
    return rows;
}

async function loadRanking(mode, minutes) {
    const body = document.getElementById('ranking-body');
    body.innerHTML = '<div class="status-msg">LOADING...</div>';
    const target = targetDateStr();
    document.getElementById('date-label').textContent = target.slice(5); // 年を省略しMM/DDのみ表示
    try {
        const allRows = await fetchAllRows(mode, minutes);
        filteredRows = allRows.filter(row => jstDateStr(parseServerTime(row.created_at)) === target);
        totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
        // 自分のスコアが見つかれば、それが載っているページから表示する
        let startPage = 1;
        if (highlightId) {
            const idx = filteredRows.findIndex(r => r.id !== undefined && String(r.id) === String(highlightId));
            if (idx !== -1) startPage = Math.floor(idx / PAGE_SIZE) + 1;
        }
        renderPage(startPage);
    } catch (e) {
        filteredRows = [];
        totalPages = 1;
        document.getElementById('page-info').textContent = `PAGE 1 / 1`;
        document.getElementById('prev-btn').disabled = true;
        document.getElementById('next-btn').disabled = true;
        body.innerHTML = '<div class="status-msg" style="color:var(--error);">読み込みに失敗しました<br><br><span style="font-size:0.7rem;opacity:0.6;">しばらくしてから再読み込みしてください</span></div>';
    }
}

function renderPage(page) {
    const body = document.getElementById('ranking-body');
    currentPage = page;

    document.getElementById('page-info').textContent = `PAGE ${currentPage} / ${totalPages}`;
    document.getElementById('prev-btn').disabled = currentPage <= 1;
    document.getElementById('next-btn').disabled = currentPage >= totalPages;

    if (filteredRows.length === 0) {
        body.innerHTML = '<div class="status-msg">今日はまだスコアがありません</div>';
        return;
    }

    const offset = (currentPage - 1) * PAGE_SIZE;
    const pageRows = filteredRows.slice(offset, offset + PAGE_SIZE);
    let html = `<div class="ranking-wrap"><table class="ranking-table">
        <thead><tr>
            <th>RANK</th>
            <th>NICKNAME</th>
            <th>SCORE</th>
            <th>DATE</th>
        </tr></thead><tbody>`;

    let foundOnThisPage = false;
    pageRows.forEach((row, i) => {
        const rank = offset + i + 1;
        let rankDisplay;
        if (rank === 1) rankDisplay = '<span class="rank-1">🥇</span>';
        else if (rank === 2) rankDisplay = '<span class="rank-2">🥈</span>';
        else if (rank === 3) rankDisplay = '<span class="rank-3">🥉</span>';
        else rankDisplay = rank;

        // JST (UTC+9) で日付表示
        const d = new Date(parseServerTime(row.created_at).getTime() + 9 * 60 * 60 * 1000);
        const date = `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`;
        const beginnerBadge = row.is_beginner ? ' 🔰' : '';
        const isMine = highlightId !== null && row.id !== undefined && String(row.id) === String(highlightId);
        if (isMine) foundOnThisPage = true;

        html += `<tr${isMine ? ' class="my-entry" id="my-ranking-row"' : ''}>
            <td class="rank-num">${rankDisplay}</td>
            <td class="nickname">${escHtml(formatNickname(row.nickname))}${beginnerBadge}${isMine ? ' 📍' : ''}</td>
            <td class="score-val">${row.score}<span class="score-unit">chars</span></td>
            <td class="date-val">${date}</td>
        </tr>`;
    });

    html += '</tbody></table></div>';
    body.innerHTML = html;
    if (foundOnThisPage) {
        const el = document.getElementById('my-ranking-row');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function formatNickname(nick) {
    if (nick === 'noname') return nick;
    const upper = String(nick).replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    return upper || 'noname';
}

// 新規訪問(リンクを踏んだ/URLを直接入力した)か、再訪問(リロード/戻る・進むボタン)かを判定する。
// タブ保存されたローカル設定は再訪問時のみ復元し、新規訪問時は常にデフォルト設定から始める。
function isReturningVisit() {
    try {
        const nav = performance.getEntriesByType('navigation')[0];
        if (!nav) return false; // Navigation Timing API未対応時は安全側(新規扱い)に倒す
        return nav.type === 'reload' || nav.type === 'back_forward';
    } catch (e) {
        return false;
    }
}

// タブ（モード・分数）の選択状態をlocalStorageに保存し、次回アクセス時に復元する。
// リザルト画面からURLパラメータ付きで遷移してきた場合も、その選択を次回用に保存する。
const RANK_STORAGE_MODE = 'morseda_ranking_mode';
const RANK_STORAGE_TIME = 'morseda_ranking_time';

function saveRankingTabState() {
    try {
        localStorage.setItem(RANK_STORAGE_MODE, currentMode);
        localStorage.setItem(RANK_STORAGE_TIME, String(currentMinutes));
    } catch (e) {}
}

// 現在選択中のタブ(モード/分数)をURLのクエリ文字列にも反映する。
// リロード時にinitの初期化処理がこのURLを読み直すため、選択中のタブを保ったままリロードできる。
function updateNavLinkHrefs() {
    const qs = `?mode=${currentMode}&time=${currentMinutes}`;
    // お遊びモードのランキングへ移動する際も、今選んでいる制限時間(currentMinutes)を
    // 引き継ぐ。お遊びランキング側は時間以外(単語種別・プレイスタイル)の状態をこちらから
    // 受け取る仕組みが無いため、timeだけをクエリに付与する。
    const asobiLink = document.getElementById('nav-asobi-link');
    if (asobiLink) asobiLink.href = asobiLink.getAttribute('href').split('?')[0] + `?time=${currentMinutes}`;
    const alltimeLink = document.getElementById('nav-alltime-link');
    if (alltimeLink) alltimeLink.href = 'ranking.html' + qs;
}

function updateUrlState() {
    const params = new URLSearchParams(window.location.search);
    params.set('mode', currentMode);
    params.set('time', currentMinutes);
    history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
    saveRankingTabState();
    updateNavLinkHrefs();
}

function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tab-rx').classList.toggle('active', mode === 'RX');
    document.getElementById('tab-tx').classList.toggle('active', mode === 'TX');
    updateUrlState();
    loadRanking(currentMode, currentMinutes);
}

function switchMinutes(min) {
    currentMinutes = min;
    [1, 3, 5].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle('active', m === min);
    });
    updateUrlState();
    loadRanking(currentMode, currentMinutes);
}

function changePage(delta) {
    const newPage = currentPage + delta;
    if (newPage < 1 || newPage > totalPages) return;
    renderPage(newPage);
}

// Initial load — URLパラメータがあればそのタブを選択
(function() {
    const params = new URLSearchParams(window.location.search);
    const modeParam = params.get('mode');
    const timeParam  = parseInt(params.get('time'));
    const hlParam = params.get('hl');
    if (hlParam) highlightId = hlParam;
    let savedMode = null, savedTime = NaN;
    try {
        savedMode = localStorage.getItem(RANK_STORAGE_MODE);
        savedTime = parseInt(localStorage.getItem(RANK_STORAGE_TIME));
    } catch (e) {}
    const isReturning = isReturningVisit();
    if (modeParam === 'TX' || modeParam === 'RX') {
        currentMode = modeParam;
    } else if (isReturning && (savedMode === 'TX' || savedMode === 'RX')) {
        currentMode = savedMode;
    }
    document.getElementById('tab-rx').classList.toggle('active', currentMode === 'RX');
    document.getElementById('tab-tx').classList.toggle('active', currentMode === 'TX');
    if ([1, 3, 5].includes(timeParam)) {
        currentMinutes = timeParam;
    } else if (isReturning && [1, 3, 5].includes(savedTime)) {
        currentMinutes = savedTime;
    }
    [1, 3, 5].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle('active', m === currentMinutes);
    });
    updateUrlState();
    loadRanking(currentMode, currentMinutes);
})();

// ── キーボードショートカット ──────────────────────────────────────────────
// Escキー（Morse Boardの場合はクエスチョン・・－－・・打鍵でも同じ）でモールス打のトップ画面へ戻る。
// 1/3/5キーで制限時間タブ、R/Tキーで受信/送信モードタブを切り替え（Morse Boardで対応する符号を
// 打鍵した場合も同じキー入力として届くため、そのまま同じ条件で反応する）。Gキーでお遊びモードの
// ランキングページへ移動する。タブ切り替えは既存のswitchMode()/switchMinutes()をそのまま呼び出すため、
// クリック操作と全く同じ保存処理（URL・localStorageへのタブ状態保存）が行われる。
document.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Escape' || e.key === '?') {
        e.preventDefault();
        location.href = (document.documentElement.lang === 'en') ? '/index-en.html' : 'https://jl1gix.com';
        return;
    }
    const k = e.key.toUpperCase();
    if (k === '1' || k === '3' || k === '5') {
        e.preventDefault();
        switchMinutes(Number(k));
    } else if (k === 'R') {
        e.preventDefault();
        switchMode('RX');
    } else if (k === 'T') {
        e.preventDefault();
        switchMode('TX');
    } else if (k === 'G') {
        e.preventDefault();
        const link = document.getElementById('nav-asobi-link');
        if (link) location.href = link.getAttribute('href').split('?')[0] + `?wordcat=GENERAL&time=${currentMinutes}`;
    } else if (k === 'C') {
        e.preventDefault();
        const link = document.getElementById('nav-asobi-link');
        if (link) location.href = link.getAttribute('href').split('?')[0] + `?wordcat=CALLSIGN&time=${currentMinutes}`;
    }
});
</script>

        <style>
        :root {
            --primary: #00d06a;
            --primary-dim: #00b85a;
            --bg: #080f0b;
            --panel: #0e1f16;
            --border: #1e5c38;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(0,80,40,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(0,40,20,0.3) 0%, transparent 60%);
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }
        #game-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-top: 2px solid var(--primary);
            padding: 20px;
            border-radius: 4px;
            box-shadow:
                0 0 50px rgba(0,100,55,0.35),
                0 0 100px rgba(0,80,40,0.12),
                inset 0 1px 0 rgba(0,123,67,0.18);
            width: 95%;
            max-width: 1200px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        #game-container::before {
            content: '◈';
            position: absolute;
            top: 8px; left: 12px;
            font-size: 0.6rem;
            color: var(--primary-dim);
            opacity: 0.4;
        }
        #game-container::after {
            content: '◈';
            position: absolute;
            top: 8px; right: 12px;
            font-size: 0.6rem;
            color: var(--primary-dim);
            opacity: 0.4;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .header-bar::before {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--primary-dim));
        }
        .header-bar::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to left, transparent, var(--primary-dim));
        }
        h1 {
            margin: 0;
            letter-spacing: 10px;
            font-size: 2.4rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0,123,67,1.0), 0 0 40px rgba(0,123,67,0.5), 0 0 80px rgba(0,123,67,0.2);
        }
        .subtitle {
            font-size: 0.88rem;
            color: var(--primary-dim);
            letter-spacing: 6px;
            margin-bottom: 22px;
            opacity: 1.0;
        }
        button {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 30px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s;
            margin-top: 10px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 2px;
            font-family: inherit;
        }
        button:hover {
            background: rgba(0,123,67,0.2);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0,123,67,0.35);
            color: #fff;
        }
        .home-link-btn {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 22px;
            background: rgba(0,123,67,0.08);
            transition: all 0.2s;
        }
        .home-link-btn:hover {
            border-color: var(--primary);
            background: rgba(0,123,67,0.18);
            box-shadow: 0 0 12px rgba(0,123,67,0.3);
        }
        @media (max-width: 700px) {
            body { justify-content: flex-start; padding: 8px 0; }
            #game-container { padding: 12px; border-radius: 0; border-left: none; border-right: none; width: 100%; max-width: 100%; }
            h1 { font-size: 1.7rem; letter-spacing: 5px; }
            /* スマホ版: 右上の🌐言語切替ボタンとタイトルが被らないよう、タイトルを少し下げる */
            .header-bar { margin-top: 26px; }
            /* ホームのモード選択ボタン: モバイルでも左右並びを維持 */
            .mode-btn-row { gap: 8px !important; }
            .mode-btn-row button {
                font-size: 0.9rem !important;
                padding: 14px 6px !important;
                letter-spacing: 1px !important;
                min-width: 0 !important;
                flex: 1 1 0 !important;
            }
            .mode-btn-row button > span { font-size: 1.55rem !important; margin-bottom: 4px !important; }
            .fun-mode-btn { font-size: 0.85rem !important; padding: 10px 26px !important; }
            .fun-mode-btn > span { font-size: 1.3rem !important; }
            /* ホームのスペクトラムスコープ: 横に長すぎるのでカットして、縦幅はボタンの上下にはみ出す程度に */
            #home-scope-canvas {
                width: 88% !important;
                max-width: 340px !important;
                height: 170px !important;
                object-fit: cover !important;
            }
        }
    </style>
